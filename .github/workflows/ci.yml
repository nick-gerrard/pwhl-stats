name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pwhl
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: pwhlstats
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://pwhl:testpassword@localhost:5432/pwhlstats
          ADMIN_TOKEN: test-token
        run: uv run alembic upgrade head

      - name: Seed database
        working-directory: backend
        env:
          DATABASE_URL: postgresql://pwhl:testpassword@localhost:5432/pwhlstats
          ADMIN_TOKEN: test-token
        run: uv run python -m ingestions.run

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://pwhl:testpassword@localhost:5432/pwhlstats
          ADMIN_TOKEN: test-token
          ENABLE_POLLING: false
        run: uv run pytest -v
